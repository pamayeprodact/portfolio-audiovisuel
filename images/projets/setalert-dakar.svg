  <circle cx="55" cy="138" r="12" fill="#006844"/><path d="M49 132h12m-10 4 1 8h6l1-8m-5-4 2-3h3" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="77" y="143" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#153b30">Déchets accumulés</text>
  <rect x="31" y="173" width="247" height="46" rx="12" fill="#fff5ec" stroke="#f1dfce"/>
  <circle cx="55" cy="196" r="12" fill="#e86a16"/><path d="M46 199l7-8 5 5 4-4" stroke="#fff" stroke-width="2.4" fill="none"/>
  <text x="77" y="201" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#153b30">Voirie dégradée</text>
  <rect x="31" y="231" width="247" height="46" rx="12" fill="#eef7ff" stroke="#d4e5f5"/>
