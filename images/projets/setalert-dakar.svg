  <path d="M385 664v47" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="431" cy="687" r="23" fill="#41ad80"/><path d="M418 679h26v20h-26zm-4 0h34l-17-10z" fill="#fff"/>
  <text x="470" y="682" font-size="17" font-weight="800">COLLECTIVITÉS</text><text x="470" y="704" font-size="14">Mieux identifier les besoins</text>
  <path d="M772 664v47" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="820" cy="687" r="23" fill="#41ad80"/><path d="M808 693q4-21 25-23-2 24-25 23m0 0 16-16" fill="#fff"/>
  <text x="859" y="682" font-size="17" font-weight="800">DAKAR DURABLE</text><text x="859" y="704" font-size="14">Vers un cadre de vie plus sain</text>
