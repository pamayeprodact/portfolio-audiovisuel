<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">SetAlert Dakar — plateforme citoyenne de signalement</title>
<desc id="desc">Visuel de présentation du projet SetAlert Dakar, une plateforme en cours de réalisation pour signaler les problèmes d’insalubrité.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf8ff"/><stop offset="1" stop-color="#bbdef2"/></linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#62bfd7"/><stop offset="1" stop-color="#197b9b"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#006844"/><stop offset="1" stop-color="#00472f"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff7b11"/><stop offset="1" stop-color="#f04b12"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#14292b" flood-opacity=".22"/></filter>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#sky)"/>
<circle cx="1030" cy="92" r="49" fill="#fff" opacity=".7"/>
<path d="M0 375 Q140 324 285 375 T590 358 T900 355 T1200 330 V760 H0Z" fill="#fff" opacity=".56"/>
<!-- Dakar-inspired coastal skyline -->
<path d="M0 430 L0 386 50 386 50 351 74 351 74 415 102 415 102 361 140 361 140 428 180 428 180 330 224 330 224 428 251 428 251 375 286 375 286 430Z" fill="#8bb9ce" opacity=".75"/>
<path d="M625 435 L625 344 673 344 673 420 701 420 701 312 742 312 742 420 766 420 766 278 824 278 824 420 859 420 859 353 896 353 896 426Z" fill="#8cb2c5" opacity=".8"/>
<path d="M870 432 L870 372 910 372 910 331 951 331 951 395 991 395 991 352 1033 352 1033 425 1084 425 1084 381 1120 381 1120 430 1200 430V760H0V505Q250 438 454 507T870 432Z" fill="url(#sea)"/>
<path d="M0 565 Q190 510 350 570 T660 563 T940 545 T1200 515 V760 H0Z" fill="#d9efd9"/>
<path d="M0 610 Q245 538 465 612 T915 605 T1200 575 V760H0Z" fill="#f9fbf8"/>
<!-- brand marker -->
<g transform="translate(78 68)">
  <path d="M63 0C27 0 0 28 0 63c0 48 63 126 63 126s63-78 63-126C126 28 99 0 63 0Z" fill="url(#green)"/>
  <path d="M45 45h36v6H45zm-7 12h50l-4 49H42z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
  <path d="M53 68v26M63 68v26M73 68v26M49 43l6-8h18l6 8" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M137 19l24-19M143 42l31-7M137 66l30 7" stroke="#f26722" stroke-width="10" stroke-linecap="round"/>
</g>
<text x="230" y="133" font-family="Arial,Helvetica,sans-serif" font-size="84" font-weight="900" fill="#064d38" letter-spacing="-3">Set</text>
<text x="384" y="133" font-family="Arial,Helvetica,sans-serif" font-size="84" font-weight="900" fill="#f05a18" letter-spacing="-3">Alert</text>
<rect x="228" y="154" width="427" height="55" rx="18" fill="url(#green)"/>
<text x="255" y="193" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#fff" letter-spacing="13">DAKAR</text>
<text x="80" y="258" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#064d38" letter-spacing="5">LA PLATEFORME CITOYENNE</text>
<text x="80" y="292" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#064d38" letter-spacing="4">DE SIGNALEMENT DE L’INSALUBRITÉ</text>
<text x="80" y="371" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="900" fill="#064d38">Un Dakar plus propre,</text>
<text x="80" y="429" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="900" fill="#f05a18">c’est l’affaire de tous !</text>
<text x="83" y="474" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#143b32">Signalez les problèmes d’insalubrité</text>
<text x="83" y="503" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#143b32">dans votre quartier et contribuez</text>
<text x="83" y="532" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#143b32">à un cadre de vie plus sain.</text>
