<rect x="42" y="650" width="1116" height="75" rx="22" fill="url(#green)"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#fff">
  <circle cx="91" cy="687" r="23" fill="#41ad80"/><circle cx="84" cy="681" r="5" fill="#fff"/><circle cx="99" cy="681" r="5" fill="#fff"/><path d="M75 699q0-12 9-12t9 12m-2 0q0-12 9-12t9 12" stroke="#fff" stroke-width="4" fill="none"/>
