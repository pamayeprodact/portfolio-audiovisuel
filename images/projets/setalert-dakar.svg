  <rect x="31" y="289" width="247" height="46" rx="12" fill="#fff0f0" stroke="#f2d8d8"/>
  <circle cx="55" cy="312" r="12" fill="#d62839"/><text x="55" y="318" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="18" fill="#fff">!</text>
  <text x="77" y="317" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="15" fill="#153b30">Autre problème</text>
  <rect x="31" y="356" width="247" height="54" rx="17" fill="url(#green)"/>
  <text x="154" y="389" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#fff">Signaler maintenant →</text>
</g>
