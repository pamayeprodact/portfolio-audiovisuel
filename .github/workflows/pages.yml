name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg
      - name: Prepare website files and crop background photo
        run: |
          mkdir -p _site/images
          cp index.html _site/
          cp robots.txt sitemap.xml _site/
          cp -a images/. _site/images/
          # The uploaded source is a JPEG saved with a HEIC filename.
          # Crop a panoramic band that keeps the multiview wall, console and operator visible.
          convert "images/Image ChatGPT 21 oct. 2026, 00_13_47.heic" -crop 1152x500+0+650 +repage -resize 1600x695! -quality 88 "_site/images/regie-diffusion-2stv.jpg"
      - name: Optimise the making-of video for web playback
        run: |
          mkdir -p "_site/images/videos"
          ffmpeg -hide_banner -loglevel error -y -i "images/videos/vacances-de-ouf-making-of.mp4" -vf "scale=min(1280\,iw):-2" -c:v libx264 -preset medium -crf 27 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "_site/images/videos/vacances-de-ouf-making-of.mp4"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
