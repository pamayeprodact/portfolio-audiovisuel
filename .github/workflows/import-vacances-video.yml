name: Import Vacances de ouf video and deploy portfolio

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/import-vacances-video.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download video, add it to repository, and remove temporary workflow
        env:
          VIDEO_SOURCE: "https://d2jqrm6oza8nb6.cloudfront.net/datasets/0e413ed3-5a03-49a6-83e1-55c67df7ac90.mp4?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZGJlZWIwZTdkYjIxM2RiMyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MjY4MTk1OX0.ESMvNoYWdxzMHrFfoYKakRZ9Nrhmbi-x4Ei5SfJtUPE"
        run: |
          set -euo pipefail
          mkdir -p images/videos
          curl --fail --location --silent --show-error --retry 3 "$VIDEO_SOURCE" --output images/videos/vacances-de-ouf-making-of.mp4
          size="$(stat -c%s images/videos/vacances-de-ouf-making-of.mp4)"
          echo "Downloaded video size: ${size} bytes"
          test "$size" -gt 1000000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/videos/vacances-de-ouf-making-of.mp4
          git rm .github/workflows/import-vacances-video.yml
          git commit -m "Add Vacances de ouf making-of video"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Prepare website files
        run: |
          mkdir -p _site/images
          cp index.html _site/
          cp robots.txt sitemap.xml _site/
          cp -a images/. _site/images/
          convert "images/Image ChatGPT 21 oct. 2026, 00_13_47.heic" -crop 1152x500+0+650 +repage -resize 1600x695! -quality 88 "_site/images/regie-diffusion-2stv.jpg"
          test -s "_site/images/videos/vacances-de-ouf-making-of.mp4"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
